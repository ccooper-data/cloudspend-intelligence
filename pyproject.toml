[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudspend-intelligence"
version = "0.1.0"
description = "A zero-cost, local-first cloud spend anomaly detection portfolio project"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudspend = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]

