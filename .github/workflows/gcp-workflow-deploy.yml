name: GCP Manual Workflow Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_MANUAL_WORKFLOW to deploy the bounded workflow (no schedule)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudspend-workflow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY_MANUAL_WORKFLOW'
    runs-on: ubuntu-latest
    environment: gcp-demo
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Render the reviewed workflow definition
        run: >-
          python scripts/render_workflow.py
          --project cloudspend-intelligence-v1
          --output "$RUNNER_TEMP/cloudspend-daily.yaml"
      - name: Deploy without creating a schedule
        run: >-
          gcloud workflows deploy cloudspend-daily
          --project=cloudspend-intelligence-v1
          --location=us-central1
          --service-account=cloudspend-workflow@cloudspend-intelligence-v1.iam.gserviceaccount.com
          --source="$RUNNER_TEMP/cloudspend-daily.yaml"
          --call-log-level=log-errors-only
          --labels=environment=portfolio,data-classification=synthetic,trigger=manual
          --quiet
