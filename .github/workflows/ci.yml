name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: make demo
      - name: Verify generated data is labeled synthetic
        run: python -c "import csv; assert all(r['is_synthetic']=='true' for r in csv.DictReader(open('data/synthetic_gcp_billing.csv')))"
      - name: Build container image
        if: matrix.python-version == '3.12'
        run: docker build --tag cloudspend-api:ci .
      - name: Verify container is non-root and healthy
        if: matrix.python-version == '3.12'
        run: |
          test "$(docker run --rm --entrypoint id cloudspend-api:ci -u)" != "0"
          docker run --detach --name cloudspend-api-ci --publish 8080:8080 cloudspend-api:ci
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          docker rm --force cloudspend-api-ci
      - uses: hashicorp/setup-terraform@v4
        if: matrix.python-version == '3.12'
      - name: Check Terraform formatting
        if: matrix.python-version == '3.12'
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate Terraform without a backend or credentials
        if: matrix.python-version == '3.12'
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

