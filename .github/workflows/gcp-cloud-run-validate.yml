name: GCP Cloud Run Private API Validation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VALIDATE_PRIVATE_API to test the deployed synthetic demo"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudspend-cloud-run-validation
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm == 'VALIDATE_PRIVATE_API'
    runs-on: ubuntu-latest
    environment: gcp-demo
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: service
        name: Resolve both advertised private service URLs
        run: |
          service="$(gcloud run services describe cloudspend-api \
            --project=cloudspend-intelligence-v1 --region=us-central1 --format=json)"
          status_url="$(jq -r '.status.url' <<< "$service")"
          project_url="$(jq -r '.metadata.annotations["run.googleapis.com/urls"] | fromjson | .[0]' <<< "$service")"
          echo "status_url=$status_url" >> "$GITHUB_OUTPUT"
          echo "project_url=$project_url" >> "$GITHUB_OUTPUT"
      - id: identity_status
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.status_url }}
      - id: identity_project
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.project_url }}
      - name: Verify private, authenticated, deterministic behavior
        env:
          STATUS_URL: ${{ steps.service.outputs.status_url }}
          PROJECT_URL: ${{ steps.service.outputs.project_url }}
          STATUS_TOKEN: ${{ steps.identity_status.outputs.id_token }}
          PROJECT_TOKEN: ${{ steps.identity_project.outputs.id_token }}
        run: |
          set -euo pipefail
          printf 'STATUS_URL_Q=%q\n' "$STATUS_URL"
          printf 'PROJECT_URL_Q=%q\n' "$PROJECT_URL"
          printf 'STATUS_URL_LENGTH=%s\n' "${#STATUS_URL}"
          printf 'PROJECT_URL_LENGTH=%s\n' "${#PROJECT_URL}"
          printf '%s' "$STATUS_URL" | od -An -tx1 | sed 's/^/STATUS_URL_HEX=/'
          printf '%s' "$PROJECT_URL" | od -An -tx1 | sed 's/^/PROJECT_URL_HEX=/'

          python - <<'PY'
          import base64
          import json
          import os

          for name in ("STATUS_TOKEN", "PROJECT_TOKEN"):
              payload = os.environ[name].split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
              safe = {key: claims.get(key) for key in ("aud", "iss")}
              print(f"{name}_CLAIMS={json.dumps(safe, sort_keys=True)}")
          PY

          anonymous_status="$(curl --verbose --output /dev/null --write-out '%{http_code}' \
            "$STATUS_URL/healthz" 2> /tmp/status-curl-verbose.log)"
          cat /tmp/status-curl-verbose.log
          case "$anonymous_status" in
            401|403|404) ;;
            *) echo "Expected anonymous access to be denied, got HTTP $anonymous_status" >&2; exit 1 ;;
          esac

          status_code="$(curl --silent --output /tmp/status-health.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $STATUS_TOKEN" "$STATUS_URL/healthz")"
          project_code="$(curl --silent --output /tmp/project-health.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $PROJECT_TOKEN" "$PROJECT_URL/healthz")"
          echo "status.url matched-audience response: HTTP $status_code"
          echo "project-number matched-audience response: HTTP $project_code"

          if test "$status_code" = "200"; then
            SERVICE_URL="$STATUS_URL"
            IDENTITY_TOKEN="$STATUS_TOKEN"
            cp /tmp/status-health.json /tmp/health.json
          elif test "$project_code" = "200"; then
            SERVICE_URL="$PROJECT_URL"
            IDENTITY_TOKEN="$PROJECT_TOKEN"
            cp /tmp/project-health.json /tmp/health.json
          else
            echo "Neither advertised URL reached the authenticated health endpoint." >&2
            exit 1
          fi
          python -c 'import json; assert json.load(open("/tmp/health.json")) == {"status": "ok"}'

          python - <<'PY'
          import csv
          import json

          with open("data/synthetic_gcp_billing.csv", newline="", encoding="utf-8") as source:
              records = list(csv.DictReader(source))
          with open("/tmp/request.json", "w", encoding="utf-8") as target:
              json.dump({"records": records}, target, separators=(",", ":"))
          PY

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $IDENTITY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/request.json \
            "$SERVICE_URL/v1/anomalies" > /tmp/response.json

          python - <<'PY'
          import json

          with open("/tmp/response.json", encoding="utf-8") as source:
              result = json.load(source)
          assert result["synthetic_demo"] is True
          assert result["anomaly_count"] == 2
          actual = {(item["usage_date"], item["service"]) for item in result["anomalies"]}
          expected = {("2025-03-17", "Cloud Run"), ("2025-03-22", "BigQuery")}
          assert actual == expected, (actual, expected)
          print("Private API validation passed: anonymous denied, authenticated synthetic result matched 2 anomalies.")
          PY
