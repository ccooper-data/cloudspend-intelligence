name: GCP Cloud Run Demo Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_PRIVATE_DEMO to build and deploy the private scale-to-zero API"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudspend-cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY_PRIVATE_DEMO'
    runs-on: ubuntu-latest
    environment: gcp-demo
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and push the API image
        env:
          IMAGE: us-central1-docker.pkg.dev/cloudspend-intelligence-v1/cloudspend-api/api:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Resolve the immutable image digest
        id: image
        env:
          IMAGE: us-central1-docker.pkg.dev/cloudspend-intelligence-v1/cloudspend-api/api:${{ github.sha }}
        run: |
          digest="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          test -n "$digest"
          echo "uri=us-central1-docker.pkg.dev/cloudspend-intelligence-v1/cloudspend-api/api@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy the private scale-to-zero service
        run: >-
          gcloud run deploy cloudspend-api
          --project=cloudspend-intelligence-v1
          --region=us-central1
          --image=${{ steps.image.outputs.uri }}
          --service-account=cloudspend-api-runtime@cloudspend-intelligence-v1.iam.gserviceaccount.com
          --port=8080
          --cpu=1
          --memory=256Mi
          --concurrency=10
          --timeout=60s
          --min=0
          --max=1
          --cpu-throttling
          --ingress=all
          --labels=environment=portfolio,data-classification=synthetic
          --quiet
