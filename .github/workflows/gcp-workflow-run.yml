name: GCP Manual Workflow Run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_MANUAL_WORKFLOW to execute once and validate the synthetic results"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudspend-workflow-run
  cancel-in-progress: false

jobs:
  run:
    if: inputs.confirm == 'RUN_MANUAL_WORKFLOW'
    runs-on: ubuntu-latest
    environment: gcp-demo
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Execute the bounded workflow once
        run: >-
          gcloud workflows run cloudspend-daily
          --project=cloudspend-intelligence-v1
          --location=us-central1
          --data='{"trigger":"manual-github"}'
          --format=json
      - name: Validate deterministic anomaly output
        run: |
          count="$(bq query --project_id=cloudspend-intelligence-v1 --use_legacy_sql=false --maximum_bytes_billed=104857600 --format=csv 'SELECT COUNT(*) FROM `cloudspend-intelligence-v1.cloudspend_v1.anomalies`' | tail -n 1)"
          test "$count" = "2"
          bq query --project_id=cloudspend-intelligence-v1 --use_legacy_sql=false --maximum_bytes_billed=104857600 --format=prettyjson 'SELECT usage_date, service, project_id, sku, explanation FROM `cloudspend-intelligence-v1.cloudspend_v1.anomalies` ORDER BY usage_date, service'
