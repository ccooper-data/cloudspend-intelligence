name: GCP Terraform Plan

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PLAN to create a read-only Terraform plan"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudspend-gcp-plan
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.confirm == 'PLAN'
    runs-on: ubuntu-latest
    environment: gcp-production
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
      - name: Initialize remote state
        run: >-
          terraform -chdir=infra init
          -backend-config=bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
          -backend-config=prefix=cloudspend-v1
      - name: Create reviewed plan only
        env:
          TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email: ${{ secrets.GCP_ALERT_EMAIL }}
          TF_VAR_container_image: ${{ vars.GCP_CONTAINER_IMAGE_DIGEST }}
        run: >-
          terraform -chdir=infra plan
          -lock-timeout=5m
          -var=project_id=cloudspend-intelligence-v1
          -var=create_deployment_identity=true
          -var=deploy_workloads=true

  # Deliberately no apply job. A plan must be reviewed, the budget must already
  # be verified, and a separate approval commit must add the apply step.
